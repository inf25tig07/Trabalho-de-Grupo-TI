<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Filme Favorito</title>
    <meta name="autor" content="Tiago Loureiro/ Leonarda Veiga/ Eduardo Martins">
    <meta name="ano" content="2026">
    <meta name="palavras_chave" content="Formulário - Filme Favorito">
    <link rel="stylesheet" href="Formulario.css">
</head>
<body>

    <div class="container">

        <h1>🎬 Questionário do Filme Favorito</h1>

        <form id="quizForm">

            <label>Qual é o teu nome?</label>
            <input type="text" id="nome" required>

            <label>Qual é o teu filme favorito?</label>
            <input type="text" id="filme" required>

            <label>Em que ano foi lançado?</label>
            <input type="number" id="ano" required>

            <label>Qual é o género do filme?</label>
            <select id="genero" required>
                <option value="">Escolhe...</option>
                <option>Ação</option>
                <option>Aventura</option>
                <option>Comédia</option>
                <option>Drama</option>
                <option>Fantasia</option>
                <option>Ficção Científica</option>
                <option>Terror</option>
        </select>

        <label>Quem é a tua personagem favorita?</label>
        <input type="text" id="personagem" required>

        <label>Classificação do filme (1 a 10)</label>
        <input
            type="range"
            id="classificacao"
            min="1"
            max="10"
            value="5">

        <p class="rating">
            ⭐ Classificação:
            <span id="valorClassificacao"></span>/10
        </p>

        <label>Porque gostas deste filme?</label>
        <textarea id="motivo" rows="4" required></textarea>

        <button type="submit">Ver Resumo</button>

    </form>

    <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

    </body>
</html>
