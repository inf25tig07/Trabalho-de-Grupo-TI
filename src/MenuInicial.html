<!DOCTYPE html>
<html lang="pt">

    <head>
        <meta charset='utf-8'>
        <title>Menu Inicial</title>
        <meta name="autor" content="Tiago Loureiro/ Leonarda Veiga/ Eduardo Martins">
        <meta name="ano" content="2026">
        <meta name="palavras_chave" content="Cinema">
        <meta name="title" content="Menu Inicial">
        <link rel="stylesheet" href="MenuInicial.css">
    </head>


    <body>



        <header>
            <h1>Cinema</h1>

            <nav>
                <a href="Top10.html" target="_blank">Cinema XML</a>
                <a href="Formulario.html" target="_blank">Formulário</a>
            </nav>
        </header>

        <section>
    
            <h2>Páginas:</h2>

            <div class="carrossel">

                <button class="seta" id="anterior">❮</button>

                <div class="lista" id="lista">

                    <div class="card">
                        <a href="HistoriaCinema.html">
                            <img src="imagem1.jpg"
                            alt="Imagem de Charlie Chaplin a operar equipamento de filmagem">
                        </a>
                    </div>

                    <div class="card">
                        <a href="EvolucaoEquip.html">
                            <img src="imagem3.webp"
                                alt="Evolução da camera de filmagem ao longo dos anos">
                        </a>
                    </div>

                    <div class="card">
                        <a href="FilmesInfluentes.html">
                            <img src="imagem4.webp"
                                alt="Cartazes de vários filmes na parede de um cinema">
                        </a>
                    </div>

                </div>

                <button class="seta" id="proximo">❯</button>

            </div>

        </section>
                            
        <script>
            const listaCards = document.querySelectorAll(".card");
                    
            let indiceAtual = 0;
                    
            document.getElementById("proximo").addEventListener("click", () => {
                if (indiceAtual < listaCards.length - 1) {
                    indiceAtual++;
                    
                    listaCards[indiceAtual].scrollIntoView({
                        behavior: "smooth",
                        inline: "start",
                        block: "nearest"
                    });
                }
            });
                    
            document.getElementById("anterior").addEventListener("click", () => {
                if (indiceAtual > 0) {
                    indiceAtual--;
                    
                    listaCards[indiceAtual].scrollIntoView({
                        behavior: "smooth",
                        inline: "start",
                        block: "nearest"
                    });
                }
            });
            
        </script>
    
    </body>

</html>
